# Alembic (ADR-7.10). Команды запускаются из каталога backend/:
#   uv run alembic upgrade head
#   uv run alembic downgrade -1
#   uv run alembic revision --autogenerate --rev-id 0002 -m menu
#
# Строки подключения здесь нет (репозиторий публичный): env.py берёт DATABASE_URL из
# окружения или .env через Settings. Параметр timezone не задан — иначе для генерации
# ревизий понадобилась бы база часовых поясов.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Ревизии с ручными ID: 0001_tenants_tables.py, 0002_menu.py, ...
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Форматирование новой ревизии ruff-ом как модулем Python: одинаково на Windows и Linux.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
