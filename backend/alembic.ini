# Alembic (ADR-7.10). Run from backend/: uv run alembic upgrade head.
# ASCII only: Alembic reads this file in the locale encoding (cp1252 on Windows CI),
# so Russian comments here would break it. Details are in README.md and ADR-7.10.
#
# No connection string here (public repo): env.py takes DATABASE_URL from the
# environment or .env via Settings. No "timezone" option, otherwise generating
# revisions would require a timezone database.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Revisions use manual ids: 0001_tenants_tables.py, 0002_menu.py, ...
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Format new revisions with ruff as a Python module: same on Windows and Linux.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
