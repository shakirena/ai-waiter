[project]
name = "ai-waiter"
version = "0.1.0"
description = "Backend ИИ-официанта: чат гостя, панель официанта, админка, Integration API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    # PostgreSQL (#7, ADR-7.9): драйвер asyncpg (ADR-5), миграции Alembic.
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # База часовых поясов для zoneinfo: на Windows системной нет (ADR-7.13).
    "tzdata",
    # Импорт меню из XLSX (#65, ADR-8.7): openpyxl — только в app/menu_sync/files/xlsx_reader.py;
    # defusedxml openpyxl подхватывает сам — защита от XML-бомб и внешних сущностей (XXE).
    # <3.2: xlsx_reader опирается на ReadOnlyWorksheet._worksheet_path (тест в test_menu_xlsx).
    "openpyxl>=3.1,<3.2",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# Режим scaled (ADR-1): Redis pub/sub, rate-limit и очередь arq.
# В режиме single эти пакеты не нужны и не импортируются.
scaled = [
    "redis>=5.0",
    "arq>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "fakeredis>=2.23",  # in-memory замена Redis для unit-тестов scaled-реализаций (AC-4)
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]  # корень пакетов: app и tests — first-party для isort

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "ASYNC",         # блокирующие вызовы в async-коде
    "S",             # bandit
    "DTZ",           # только aware-datetime (timestamptz)
    "PTH",           # только pathlib (переносимость, ADR-5)
    "TID",           # banned-api: граница Redis (ADR-1)
    "RUF",
]
# Тексты и docstring-и на русском: кириллица не должна считаться «похожими на латиницу» символами.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Каталог миграций backend/alembic/ не пакет приложения: alembic — сторонняя библиотека.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"redis".msg = "Redis только в app/core/scaled/ — используйте EventBus/TaskScheduler/RateLimiter (ADR-1)"
"arq".msg = "arq только в app/core/scaled/ — используйте TaskScheduler (ADR-1)"
"apscheduler".msg = "APScheduler только в app/core/single/ — используйте TaskScheduler (ADR-1)"
"psycopg".msg = "Драйвер БД — asyncpg (ADR-5): psycopg async требует смены event loop policy на Windows"
"psycopg2".msg = "Драйвер БД — asyncpg (ADR-5)"
"openpyxl".msg = "openpyxl только в app/menu_sync/files/xlsx_reader.py — используйте read_xlsx_table (ADR-8.7)"

[tool.ruff.lint.per-file-ignores]
"app/menu_sync/files/xlsx_reader.py" = ["TID251"]
"app/core/scaled/**" = ["TID251"]
"app/core/single/**" = ["TID251"]
"tests/**" = ["S101", "S105", "S106", "TID251"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "db: требует PostgreSQL (только Linux-джоб CI)",
    "scaled: требует настоящий Redis (только Linux-джоб CI); с fakeredis маркер не нужен",
]

[tool.coverage.run]
source = ["app"]
branch = true
