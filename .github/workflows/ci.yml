# CI: линтер и тесты backend и frontend на Linux и Windows (ТЗ 9.2, раздел 8, NFR-8;
# arch: ADR-4, ADR-5, ADR-6, spec AC-8).
#
# - Секреты не нужны и не используются; токен — только на чтение (permissions ниже).
# - Матрица ubuntu-latest + windows-latest с fail-fast: false: упавшая ОС не отменяет
#   другую, но любой упавший шаг на любой ОС делает проверку красной.
# - Тесты с PostgreSQL/Redis (маркеры db, scaled) — только в Linux-джобе backend-services:
#   сервис-контейнеры GitHub Actions работают только на Linux (ADR-5).
# - Во всех джобах shell — bash (на windows-latest это Git Bash): один синтаксис шагов
#   на обеих ОС, без расхождений между bash и PowerShell.
# - Версии actions закреплены мажорными тегами.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку PR отменяет устаревший прогон; прогоны main не отменяются,
# чтобы у каждого коммита main был свой результат.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # uv не обновляет uv.lock ни в одной команде: рассинхрон pyproject.toml и uv.lock — ошибка.
  UV_FROZEN: "1"

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Установить uv и Python 3.12 (с кэшем)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Установить зависимости (uv.lock, extra scaled)
        run: uv sync --frozen --extra scaled

      - name: Проверить версию Python
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"

      - name: Линтер ruff check
        run: uv run ruff check --output-format=github .

      - name: Форматирование ruff format --check
        run: uv run ruff format --check .

      # Unit-тесты без внешних сервисов. Маркеры db/scaled объявлены в pyproject.toml,
      # поэтому --strict-markers из addopts не мешает фильтру -m.
      - name: Тесты pytest (без PostgreSQL и Redis)
        run: uv run pytest -q -m "not db and not scaled"

  backend-services:
    name: backend (postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # Учётные данные одноразовой БД сервис-контейнера CI, не секрет.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # localhost — адрес сервис-контейнеров на раннере GitHub Actions, не сеть заведения.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Установить uv и Python 3.12 (с кэшем)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Установить зависимости (uv.lock, extra scaled)
        run: uv sync --frozen --extra scaled

      # До #7 (БД) и интеграционных тестов scaled набор пуст: pytest завершается с кодом 5
      # («тесты не выбраны»). Только этот код считается успехом, и он виден как notice;
      # любые другие ненулевые коды (1 — упавшие тесты, 2 — ошибка сбора, 3 — внутренняя
      # ошибка, 4 — ошибка аргументов) проходят как есть и делают проверку красной.
      - name: Тесты pytest с PostgreSQL и Redis (маркеры db, scaled)
        run: |
          set +e
          uv run pytest -q -m "db or scaled"
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::notice title=pytest db/scaled::Тестов с маркерами db/scaled пока нет (код 5) — шаг пропущен"
            exit 0
          fi
          exit "$code"

  frontend:
    name: frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node LTS 22 — минимальная версия из engines в frontend/package.json.
      - name: Установить Node.js 22 (с кэшем npm)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости (npm ci)
        run: npm ci

      - name: Линтер (npm run lint)
        run: npm run lint

      - name: Проверка типов (npm run typecheck)
        run: npm run typecheck

      - name: Тесты (npm run test -- --run)
        run: npm run test -- --run

      - name: Сборка (npm run build)
        run: npm run build
